spring.application.name=expense-tracker

spring.datasource.url=jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

app.jwt.private-key=file:./secrets/jwt-private.pem
app.jwt.public-key=file:./secrets/jwt-public.pem
app.jwt.issuer=expense-tracker
app.jwt.expiration=PT15M